<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mentat Browser Pilot</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0d111c;
      --card-bg: rgba(22, 27, 46, 0.85);
      --border: rgba(245, 158, 11, 0.25);
      --amber: #f59e0b;
      --cyan: #06b6d4;
      --text: #f8fafc;
      --muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 320px;
      background: var(--bg);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', sans-serif;
      padding: 16px;
      line-height: 1.4;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 800;
      font-size: 1rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--amber);
    }

    .brand-icon {
      width: 18px;
      height: 18px;
      border: 2px solid var(--amber);
      transform: rotate(45deg);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .brand-dot {
      width: 6px;
      height: 6px;
      background: var(--cyan);
      box-shadow: 0 0 8px var(--cyan);
      border-radius: 50%;
    }

    .status-badge {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.7rem;
      padding: 3px 8px;
      background: rgba(6, 182, 212, 0.15);
      border: 1px solid rgba(6, 182, 212, 0.4);
      border-radius: 999px;
      color: var(--cyan);
      font-weight: 600;
    }

    .tagline {
      font-size: 0.8rem;
      color: var(--muted);
      margin-bottom: 14px;
      font-style: italic;
    }

    .btn-summon {
      width: 100%;
      background: linear-gradient(135deg, var(--amber) 0%, #d97706 100%);
      color: #0f172a;
      border: none;
      border-radius: 10px;
      padding: 10px 14px;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 14px;
      box-shadow: 0 4px 14px rgba(245, 158, 11, 0.3);
      transition: opacity 0.2s, transform 0.1s;
    }

    .btn-summon:hover {
      opacity: 0.95;
      transform: translateY(-1px);
    }

    .section-title {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
      margin-bottom: 8px;
      font-weight: 700;
    }

    .quick-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 14px;
    }

    .quick-chip {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 0.75rem;
      color: #cbd5e1;
      font-family: 'JetBrains Mono', monospace;
      cursor: pointer;
      transition: all 0.15s;
    }

    .quick-chip:hover {
      border-color: var(--amber);
      color: #fff;
      background: rgba(245, 158, 11, 0.08);
    }

    .footer-keys {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 0.75rem;
      color: var(--muted);
    }

    kbd {
      background: rgba(255, 255, 255, 0.1);
      padding: 2px 6px;
      border-radius: 4px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #cbd5e1;
      font-family: 'JetBrains Mono', monospace;
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="brand">
      <div class="brand-icon"><div class="brand-dot"></div></div>
      <span>Mentat</span>
    </div>
    <span class="status-badge">System 1 Ready</span>
  </div>

  <p class="tagline">"It is by will alone I set my mind in motion."</p>

  <button class="btn-summon" id="btn-summon-hud">
    <span>⚡ Summon HUD in Tab</span>
    <kbd style="background: rgba(0,0,0,0.2); border-color: rgba(0,0,0,0.3); color: #0f172a;">Alt+M</kbd>
  </button>

  <div class="section-title">Try Spoken or Typed Commands:</div>
  <div class="quick-list">
    <div class="quick-chip">"Click on repositories"</div>
    <div class="quick-chip">"Search for mechanical keyboards"</div>
    <div class="quick-chip">"Open billing and subscription"</div>
    <div class="quick-chip">"Click on Sign In"</div>
  </div>

  <div class="footer-keys">
    <span>Toggle HUD:</span>
    <kbd>Alt + M</kbd>
  </div>

  <script src="popup.js"></script>
</body>
</html>
